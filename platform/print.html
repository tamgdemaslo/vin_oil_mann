<script type="text/babel">
  const { useState } = React;
  // hash: #/diag-print/TGM-2026-0436  →  id
  function parseId() {
    const m = (location.hash || '').match(/diag-print\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : DIAG_STATE.shipment;
  }
  function PrintApp() {
    const [id, setId] = useState(parseId());
    // minimal router so useRoute()/Link don't break; nav is a no-op here
    const route = { params: { id }, path: 'diag-print', go: () => {}, navigate: () => {} };
    return (
      <RouterCtx.Provider value={route}>
        <DiagnosticsPrintCard />
      </RouterCtx.Provider>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);
</script>
