# The proxy lives in WireGuard's network namespace. Only peers from the
# private Docker network may use it; it is never published on the host.
nserver 1.1.1.1
nscache 65536
timeouts 1 5 30 60 180 1800 15 60

auth none
allow * 127.0.0.1
allow * 172.16.0.0/12
deny *

# OpenAI SDK uses the HTTP CONNECT endpoint; GramJS uses SOCKS5.
proxy -p8888 -n
socks -p1080
