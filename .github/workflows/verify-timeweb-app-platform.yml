name: Verify source for Timeweb App Platform

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  migration-approval:
    name: migration_approval_required
    runs-on: ubuntu-latest
    steps:
      - name: Require verified Timeweb backup and separate migration approval
        env:
          TIMEWEB_BRANCH_INTEGRATION_MIGRATION_APPROVAL: ${{ vars.TIMEWEB_BRANCH_INTEGRATION_MIGRATION_APPROVAL }}
        run: |
          set -euo pipefail
          if [ "${TIMEWEB_BRANCH_INTEGRATION_MIGRATION_APPROVAL:-}" != "approved-with-verified-timeweb-backup" ]; then
            echo "status=migration_approval_required"
            echo "Set the repository variable only after the Timeweb PostgreSQL backup has been created, checksum-verified and separately approved."
            exit 1
          fi

  verify:
    name: Verify committed source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the checkout is clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enforce Timeweb-only deployment policy
        run: npm run check:timeweb-only

      - name: Verify AI tool policy
        run: npm run test:ai-tool-loop-policy

      - name: Verify branch operational integrations
        run: npm run test:branch-operational-integrations

      - name: Verify branch isolation
        run: npm run test:branch-isolation

      - name: Verify ROSSKO branch consumers
        run: npm run test:ai-assistant-branch-context && npm run test:rossko-api

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build

      - name: Verify price-label font assets in standalone build
        run: npm run test:price-label-pdf-artifact
