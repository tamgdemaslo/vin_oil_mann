name: Build and deploy immutable release to Selectel

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Production tag for a manual build/deploy, for example production-2026-08-03.3"
        required: false
        type: string
      deployment_mode:
        description: "Manual build/push only, or deploy after all database approvals are complete"
        required: true
        default: BUILD_ONLY
        type: choice
        options:
          - BUILD_ONLY
          - DEPLOY_PRODUCTION

concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'DEPLOY_PRODUCTION')) && 'production-deploy' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  SELECTEL_REGISTRY: cr.selcloud.ru

jobs:
  verify:
    name: Verify committed source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      lock_hash: ${{ steps.metadata.outputs.lock_hash }}
      schema_hash: ${{ steps.metadata.outputs.schema_hash }}
      migrations: ${{ steps.metadata.outputs.migrations }}
      expected_migration: ${{ steps.metadata.outputs.expected_migration }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce source and deployment policy
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
          git diff --quiet
          git diff --cached --quiet

          case "$EVENT_NAME" in
            push)
              if [[ "${{ github.ref }}" == refs/heads/main ]]; then
                release_tag="production-$(date -u +%Y-%m-%d).${{ github.run_number }}"
              else
                release_tag="ci-${GITHUB_SHA:0:12}"
              fi
              ;;
            pull_request)
              release_tag="ci-pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
              ;;
            workflow_dispatch)
              [[ "$SOURCE_BRANCH" == main || "$SOURCE_BRANCH" == release/* || "$SOURCE_BRANCH" == hotfix/* ]]
              [[ "$REQUESTED_RELEASE_TAG" =~ ^production-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
              if [[ "$DEPLOYMENT_MODE" == DEPLOY_PRODUCTION ]]; then
                [[ "$SOURCE_BRANCH" == main ]]
              fi
              release_tag="$REQUESTED_RELEASE_TAG"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 64
              ;;
          esac

          if [[ "$release_tag" == production-* ]] && git rev-parse --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify deploy policy and rollback behavior
        run: |
          npm run check:selectel-deploy
          npm run test:selectel-deploy-flow
          npm run test:ai-tool-loop-policy

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build

      - name: Record deterministic build metadata
        id: metadata
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          lock_hash="$(sha256sum package-lock.json | cut -d' ' -f1)"
          schema_hash="$(sha256sum prisma/schema.prisma | cut -d' ' -f1)"
          migrations="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)"
          expected_migration="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n1)"
          [[ -n "$expected_migration" ]]
          {
            echo "built_at=$built_at"
            echo "lock_hash=$lock_hash"
            echo "schema_hash=$schema_hash"
            echo "migrations=$migrations"
            echo "expected_migration=$expected_migration"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build and publish immutable images
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      migration_digest: ${{ steps.migration.outputs.digest }}
      app_repository: ${{ steps.repositories.outputs.app }}
      migration_repository: ${{ steps.repositories.outputs.migration }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Resolve Selectel repositories
        id: repositories
        env:
          REGISTRY_NAME: ${{ vars.SELECTEL_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          [[ "$REGISTRY_NAME" =~ ^[a-zA-Z0-9._-]+$ ]]
          echo "app=cr.selcloud.ru/$REGISTRY_NAME/eco-platform" >> "$GITHUB_OUTPUT"
          echo "migration=cr.selcloud.ru/$REGISTRY_NAME/eco-platform-migrations" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Selectel Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SELECTEL_REGISTRY }}
          username: ${{ secrets.SELECTEL_REGISTRY_USERNAME }}
          password: ${{ secrets.SELECTEL_REGISTRY_PASSWORD }}

      - name: Build and push standalone application image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.repositories.outputs.app }}:git-${{ github.sha }}
            ${{ steps.repositories.outputs.app }}:${{ needs.verify.outputs.release_tag }}
          build-args: |
            APP_RELEASE=${{ needs.verify.outputs.release_tag }}
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILT_AT=${{ needs.verify.outputs.built_at }}
            APP_PACKAGE_LOCK_SHA256=${{ needs.verify.outputs.lock_hash }}
            APP_PRISMA_SCHEMA_SHA256=${{ needs.verify.outputs.schema_hash }}
            APP_MIGRATIONS_INCLUDED=${{ needs.verify.outputs.migrations }}
            APP_EXPECTED_MIGRATION=${{ needs.verify.outputs.expected_migration }}
            APP_TEST_RESULT=passed
          cache-from: type=registry,ref=${{ steps.repositories.outputs.app }}:buildcache
          cache-to: type=registry,ref=${{ steps.repositories.outputs.app }}:buildcache,mode=max

      - name: Build and push separate migration image
        id: migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migration
          push: true
          tags: |
            ${{ steps.repositories.outputs.migration }}:git-${{ github.sha }}
            ${{ steps.repositories.outputs.migration }}:${{ needs.verify.outputs.release_tag }}
          build-args: |
            APP_RELEASE=${{ needs.verify.outputs.release_tag }}
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILT_AT=${{ needs.verify.outputs.built_at }}
            APP_PACKAGE_LOCK_SHA256=${{ needs.verify.outputs.lock_hash }}
            APP_PRISMA_SCHEMA_SHA256=${{ needs.verify.outputs.schema_hash }}
            APP_MIGRATIONS_INCLUDED=${{ needs.verify.outputs.migrations }}
            APP_EXPECTED_MIGRATION=${{ needs.verify.outputs.expected_migration }}
            APP_TEST_RESULT=passed
          cache-from: type=registry,ref=${{ steps.repositories.outputs.app }}:buildcache

      - name: Create release manifest
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
          APP_IMAGE_REPOSITORY: ${{ steps.repositories.outputs.app }}
          APP_IMAGE_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATION_IMAGE_REPOSITORY: ${{ steps.repositories.outputs.migration }}
          MIGRATION_IMAGE_DIGEST: ${{ steps.migration.outputs.digest }}
          BUILT_AT: ${{ needs.verify.outputs.built_at }}
          TEST_RESULT: passed
        run: node scripts/create-release-manifest.mjs "$RUNNER_TEMP/release-manifest.json"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.verify.outputs.release_tag }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error

  deployment_gate:
    name: Determine production deployment eligibility
    needs: [verify, image]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SELECTEL_AUTO_DEPLOY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'DEPLOY_PRODUCTION') }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      status: ${{ steps.gate.outputs.status }}
      active_commit: ${{ steps.gate.outputs.active_commit }}
      new_migrations: ${{ steps.gate.outputs.new_migrations }}
      changed_migrations: ${{ steps.gate.outputs.changed_migrations }}
      removed_migrations: ${{ steps.gate.outputs.removed_migrations }}
    steps:
      - name: Check out candidate and production history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare candidate migrations with active production release
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACTIVE_RELEASE_PATH: ${{ vars.DEPLOY_ACTIVE_RELEASE_PATH }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          state_file="${ACTIVE_RELEASE_PATH:-/opt/tgm/.deploy/active-release.env}"
          [[ "$state_file" =~ ^/opt/[A-Za-z0-9._/-]+/active-release\.env$ ]]
          active_commit="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; state='$state_file'; test -r \"\$state\"; . \"\$state\"; printf '%s' \"\$ACTIVE_COMMIT_SHA\"")"
          [[ "$active_commit" =~ ^[0-9a-f]{40}$ ]]

          state_dir="${state_file%/active-release.env}"
          lock_status="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; lock='$state_dir/production-deploy.lock'; test -e \"\$lock\"; if flock -n \"\$lock\" true; then printf free; else printf busy; fi")"
          [[ "$lock_status" == free || "$lock_status" == busy ]]

          git fetch --no-tags origin main:refs/remotes/origin/main

          status=deploy_allowed
          new_migrations=none
          changed_migrations=none
          removed_migrations=none

          if [[ "$lock_status" == busy ]]; then
            status=deployment_lock_busy
          elif ! git merge-base --is-ancestor "$CANDIDATE_COMMIT" refs/remotes/origin/main; then
            status=candidate_not_in_main
          elif ! git cat-file -e "$active_commit^{commit}"; then
            status=active_production_commit_missing
          elif ! git merge-base --is-ancestor "$active_commit" "$CANDIDATE_COMMIT"; then
            status=production_history_alignment_required
          else
            active_list="$(mktemp)"
            candidate_list="$(mktemp)"
            shared_list="$(mktemp)"
            git ls-tree -r --name-only "$active_commit" -- prisma/migrations \
              | awk -F/ 'NF >= 3 { print $3 }' | sort -u > "$active_list"
            find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -u > "$candidate_list"

            new_migrations="$(comm -13 "$active_list" "$candidate_list" | paste -sd, -)"
            removed_migrations="$(comm -23 "$active_list" "$candidate_list" | paste -sd, -)"
            comm -12 "$active_list" "$candidate_list" > "$shared_list"
            changed=()
            while IFS= read -r migration; do
              if ! git diff --quiet "$active_commit" "$CANDIDATE_COMMIT" -- "prisma/migrations/$migration"; then
                changed+=("$migration")
              fi
            done < "$shared_list"
            changed_migrations="$(IFS=,; echo "${changed[*]:-}")"

            new_migrations="${new_migrations:-none}"
            removed_migrations="${removed_migrations:-none}"
            changed_migrations="${changed_migrations:-none}"

            if [[ "$removed_migrations" != none || "$changed_migrations" != none ]]; then
              status=migration_history_violation
            elif [[ "$new_migrations" != none ]]; then
              status=migration_approval_required
              if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
                marker="$state_dir/migrations/$RELEASE_TAG.env"
                marker_commit="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
                  "set -eu; marker='$marker'; test -r \"\$marker\"; . \"\$marker\"; printf '%s' \"\$commitSha\"" 2>/dev/null || true)"
                if [[ "$marker_commit" == "$CANDIDATE_COMMIT" ]]; then
                  status=deploy_allowed
                fi
              fi
            fi
          fi

          {
            echo "status=$status"
            echo "active_commit=$active_commit"
            echo "new_migrations=$new_migrations"
            echo "changed_migrations=$changed_migrations"
            echo "removed_migrations=$removed_migrations"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment gate"
            echo "- status: \`$status\`"
            echo "- active commit: \`$active_commit\`"
            echo "- candidate commit: \`$CANDIDATE_COMMIT\`"
            echo "- new migrations: \`$new_migrations\`"
            echo "- changed migrations: \`$changed_migrations\`"
            echo "- removed migrations: \`$removed_migrations\`"
          } >> "$GITHUB_STEP_SUMMARY"

  migration_approval_required:
    name: migration_approval_required
    needs: [verify, image, deployment_gate]
    if: ${{ always() && needs.deployment_gate.result == 'success' && needs.deployment_gate.outputs.status == 'migration_approval_required' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop automatic deployment and request the migration window
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
          MIGRATION_IMAGE_DIGEST: ${{ needs.image.outputs.migration_digest }}
          NEW_MIGRATIONS: ${{ needs.deployment_gate.outputs.new_migrations }}
        run: |
          {
            echo "### migration_approval_required"
            echo "Production was not changed."
            echo "- release: \`$RELEASE_TAG\`"
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- migration image: \`$MIGRATION_IMAGE_DIGEST\`"
            echo "- new migrations: \`$NEW_MIGRATIONS\`"
            echo "Request owner approval and a maintenance window, then run migrate-selectel.yml."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=migration_approval_required::Production deploy is blocked pending owner approval and a maintenance window."
          exit 78

  production_deploy_blocked:
    name: Production deploy blocked by safety policy
    needs: [deployment_gate]
    if: ${{ always() && needs.deployment_gate.result == 'success' && needs.deployment_gate.outputs.status != 'deploy_allowed' && needs.deployment_gate.outputs.status != 'migration_approval_required' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the exact blocker
        env:
          STATUS: ${{ needs.deployment_gate.outputs.status }}
          ACTIVE_COMMIT: ${{ needs.deployment_gate.outputs.active_commit }}
          CHANGED_MIGRATIONS: ${{ needs.deployment_gate.outputs.changed_migrations }}
          REMOVED_MIGRATIONS: ${{ needs.deployment_gate.outputs.removed_migrations }}
        run: |
          echo "::error title=$STATUS::Automatic production deployment is blocked. Active commit: $ACTIVE_COMMIT; changed migrations: $CHANGED_MIGRATIONS; removed migrations: $REMOVED_MIGRATIONS."
          exit 1

  deploy:
    name: Deploy exact digest with blue/green rollback
    needs: [verify, image, deployment_gate]
    if: ${{ needs.deployment_gate.outputs.status == 'deploy_allowed' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Enforce main-only production source
        run: test "${{ github.ref }}" = refs/heads/main

      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact application digest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}
          IMAGE_DIGEST: ${{ needs.image.outputs.app_digest }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^production-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          script="${DEPLOY_SCRIPT_PATH:-/opt/tgm/deploy/selectel/deploy-image.sh}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "$script" "$IMAGE_DIGEST" "$RELEASE_TAG" "$COMMIT_SHA"

      - name: Verify public release identity
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.app_digest }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLIC_ORIGIN" == https://* ]]
          version="$(curl --fail --silent --show-error --max-time 15 "$PUBLIC_ORIGIN/api/system/version")"
          grep -Fq "\"release\":\"$RELEASE_TAG\"" <<<"$version"
          grep -Fq "\"commitSha\":\"$COMMIT_SHA\"" <<<"$version"
          grep -Fq "\"imageDigest\":\"$IMAGE_DIGEST\"" <<<"$version"
          curl --fail --silent --show-error --max-time 15 "$PUBLIC_ORIGIN/api/health/live" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$PUBLIC_ORIGIN/api/health/ready" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$PUBLIC_ORIGIN/login" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$PUBLIC_ORIGIN/api/public/stats" >/dev/null

  tag:
    name: Tag successful production release
    needs: [verify, image, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable production tag
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.app_digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Selectel production $RELEASE_TAG ($IMAGE_DIGEST)" "$COMMIT_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
